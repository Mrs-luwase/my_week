<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">My Week</title>
  <desc id="d">A Flutter timetable app. Five day tiles from Monday to Friday, with Monday selected and a red clash marker.</desc>
  <rect width="1200" height="300" fill="#E9F0E7"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="70" y="152" font-size="88" font-weight="700" fill="#3F6B52">My Week</text>
    <text x="73" y="202" font-size="30" fill="#3F6B52">A Flutter timetable app</text>

    <!-- Monday: selected, with a red clash marker -->
    <rect x="590" y="80" width="100" height="140" rx="20" fill="#3F6B52"/>
    <text x="640" y="125" font-size="26" fill="#FFFFFF" text-anchor="middle">Mon</text>
    <rect x="610" y="160" width="60" height="9" rx="4.5" fill="#E05A5A"/>
    <rect x="610" y="178" width="60" height="9" rx="4.5" fill="#E05A5A"/>

    <!-- Tuesday to Friday -->
    <rect x="704" y="80" width="100" height="140" rx="20" fill="#FFFFFF" stroke="#CFDDD0" stroke-width="2"/>
    <text x="754" y="125" font-size="26" fill="#3F6B52" text-anchor="middle">Tue</text>
    <rect x="724" y="160" width="60" height="9" rx="4.5" fill="#8DB59A"/>

    <rect x="818" y="80" width="100" height="140" rx="20" fill="#FFFFFF" stroke="#CFDDD0" stroke-width="2"/>
    <text x="868" y="125" font-size="26" fill="#3F6B52" text-anchor="middle">Wed</text>
    <rect x="838" y="160" width="60" height="9" rx="4.5" fill="#B7D3A8"/>
    <rect x="838" y="178" width="60" height="9" rx="4.5" fill="#9CC2BE"/>

    <rect x="932" y="80" width="100" height="140" rx="20" fill="#FFFFFF" stroke="#CFDDD0" stroke-width="2"/>
    <text x="982" y="125" font-size="26" fill="#3F6B52" text-anchor="middle">Thu</text>
    <rect x="952" y="160" width="60" height="9" rx="4.5" fill="#D5E39A"/>

    <rect x="1046" y="80" width="100" height="140" rx="20" fill="#FFFFFF" stroke="#CFDDD0" stroke-width="2"/>
    <text x="1096" y="125" font-size="26" fill="#3F6B52" text-anchor="middle">Fri</text>
    <rect x="1066" y="160" width="60" height="9" rx="4.5" fill="#8DB59A"/>
    <rect x="1066" y="178" width="60" height="9" rx="4.5" fill="#B7D3A8"/>
  </g>
</svg>
